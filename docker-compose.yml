version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: crm_cc
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      TELEFONY: ${TELEFONY}
      BILLING_MODE: ${BILLING_MODE}
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/crm_cc
      REDIS_URL: redis://redis:6379/0
      AMI_HOST: ${AMI_HOST}
      AMI_PORT: ${AMI_PORT}
      AMI_USER: ${AMI_USER}
      AMI_PASS: ${AMI_PASS}
      BILLING_URL: ${BILLING_URL}
      BILLING_TOKEN: ${BILLING_TOKEN}
      APP_TOKEN: ${APP_TOKEN}
    ports:
      - "8001:8000"
    depends_on: [db, redis]
    networks: [internal]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "81:80"
    depends_on: [backend]
    networks: [internal]

volumes:
  db_data:
  redis_data:

networks:
  internal:
