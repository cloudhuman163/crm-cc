server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /dialer/events {
        proxy_pass http://backend:8000/dialer/events;
        proxy_set_header Host $host;
        # SSE: буферизация выключена, иначе события идут пачками
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(health|dialer) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}

